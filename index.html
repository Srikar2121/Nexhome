<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXHOME | Smart Home Project</title>

  <style>
    
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

:root {
  --bg: #050912;
  --panel: rgba(10, 24, 42, 0.78);
  --cyan: #55eaff;
  --blue: #4388ff;
  --text: #edfaff;
  --muted: #9bb4ca;
  --line: rgba(85, 234, 255, 0.23);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', sans-serif;
  background:
    radial-gradient(ellipse at 50% 0%, #10274a 0%, transparent 48%),
    var(--bg);
  color: var(--text);
  line-height: 1.75;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -1;
  background-image:
    linear-gradient(rgba(85, 234, 255, 0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(85, 234, 255, 0.035) 1px, transparent 1px);
  background-size: 42px 42px;
  mask-image: linear-gradient(to bottom, black, transparent 90%);
}

header {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 24px;
  padding: 18px 7%;
  background: rgba(5, 9, 18, 0.88);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(18px);
}

.logo {
  color: var(--cyan);
  font-family: 'Orbitron', sans-serif;
  font-size: 1.35rem;
  font-weight: 800;
  letter-spacing: 3px;
  text-shadow: 0 0 20px #55eaff66;
}

nav {
  display: flex;
  flex-wrap: wrap;
  gap: 22px;
}

nav a {
  color: var(--muted);
  text-decoration: none;
  font-size: 0.85rem;
  transition: color 0.2s;
}

nav a:hover {
  color: var(--cyan);
}

.hero {
  position: relative;
  min-height: 86vh;
  padding: 110px 8%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  background:
    radial-gradient(ellipse at 78% 45%, #0a467055 0%, transparent 36%),
    linear-gradient(135deg, transparent, #07162a88);
}

.tag,
.section-label {
  color: var(--cyan);
  font-family: 'Orbitron', sans-serif;
  font-size: 0.72rem;
  letter-spacing: 3px;
  text-transform: uppercase;
}

.tag {
  padding: 8px 14px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: #55eaff0a;
  box-shadow: 0 0 24px #55eaff0c;
}

h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(2.8rem, 7vw, 6rem);
  line-height: 1.17;
  letter-spacing: -2px;
  margin: 28px 0;
}

h1 span {
  color: var(--cyan);
  text-shadow: 0 0 36px #55eaff55;
}

.hero p,
.intro {
  max-width: 740px;
  color: var(--muted);
  font-size: 1.03rem;
}

.button {
  display: inline-block;
  margin-top: 30px;
  padding: 13px 23px;
  color: #04111d;
  background: var(--cyan);
  text-decoration: none;
  font-weight: 800;
  border-radius: 4px;
  box-shadow: 0 0 25px #55eaff22;
  transition: 0.25s;
}

.button:hover {
  transform: translateY(-3px);
  box-shadow: 0 0 32px #55eaff66;
}

section {
  padding: 88px 8%;
  scroll-margin-top: 85px;
}

h2 {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(1.8rem, 4vw, 2.8rem);
  line-height: 1.35;
  margin: 12px 0 20px;
}

.alternate {
  background: linear-gradient(120deg, #091424, #07101d);
  border-block: 1px solid var(--line);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  margin-top: 36px;
}

.card {
  position: relative;
  overflow: hidden;
  padding: 27px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  backdrop-filter: blur(12px);
  transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
}

.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 65px;
  height: 2px;
  background: var(--cyan);
  box-shadow: 0 0 12px var(--cyan);
}

.card:hover {
  transform: translateY(-6px);
  border-color: #55eaff88;
  box-shadow: 0 12px 35px #0008, 0 0 22px #55eaff0b;
}

.card .icon {
  font-size: 2rem;
  filter: drop-shadow(0 0 10px #55eaff33);
}

.card h3,
.step h3 {
  margin: 12px 0;
  color: var(--cyan);
}

.card p,
.step p {
  color: var(--muted);
  font-size: 0.94rem;
}

.steps {
  display: grid;
  gap: 16px;
  margin-top: 32px;
  max-width: 850px;
}

.step {
  display: flex;
  gap: 20px;
  align-items: flex-start;
  padding: 22px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
}

.number {
  color: var(--cyan);
  font-family: 'Orbitron', sans-serif;
  font-size: 1.35rem;
  font-weight: 800;
}

.demo {
  margin-top: 30px;
  max-width: 540px;
  padding: 30px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: inset 0 0 35px #55eaff05;
}

.bulb {
  font-size: 4rem;
  margin: 12px 0;
  filter: drop-shadow(0 0 15px #55eaff33);
  transition: filter 0.3s;
}

#lightStatus {
  color: var(--muted);
}

.demo button {
  margin-top: 18px;
  padding: 12px 20px;
  background: transparent;
  color: var(--cyan);
  border: 1px solid var(--cyan);
  border-radius: 4px;
  font-weight: 700;
  cursor: pointer;
  transition: 0.2s;
}

.demo button:hover {
  background: #55eaff14;
  box-shadow: 0 0 20px #55eaff22;
}

footer {
  padding: 34px 8%;
  text-align: center;
  color: var(--muted);
  border-top: 1px solid var(--line);
  background: #040710;
}

footer strong {
  color: var(--cyan);
  font-family: 'Orbitron', sans-serif;
}

@keyframes pulse {
  0%, 100% {
    opacity: 0.75;
  }

  50% {
    opacity: 1;
  }
}

.tag {
  animation: pulse 3s ease-in-out infinite;
}

@media (max-width: 650px) {
  header {
    align-items: flex-start;
    flex-direction: column;
    gap: 12px;
  }

  nav {
    gap: 12px;
  }

  .hero {
    min-height: 75vh;
    padding: 80px 7%;
  }

  section {
    padding: 65px 7%;
  }

  .step {
    gap: 12px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation: none !important;
    transition: none !important;
  }
}
  </style>

</head>
